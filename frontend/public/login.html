<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#2c3e50" />
  <title>Login &ndash; Wearable Monitor</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>

<div class="login-page">
  <div class="login-card">

    <div class="login-header">
      <span class="login-icon">&#x1F9BA;</span>
      <h1 class="login-title">Wearable Monitor</h1>
      <p class="login-subtitle">Smart Workforce Safety System</p>
    </div>

    <form id="login-form" class="login-form" novalidate>
      <div class="form-group">
        <label for="email">Email</label>
        <input id="email" name="email" type="email"
               placeholder="user@example.com" autocomplete="email" required />
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input id="password" name="password" type="password"
               placeholder="&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;"
               autocomplete="current-password" required />
      </div>

      <div id="error-msg" class="alert alert-error" style="display:none;"></div>

      <button type="submit" id="submit-btn" class="btn btn-primary btn-full">
        Login
      </button>
    </form>

    <p class="login-footer">
      Don&rsquo;t have an account?
      <a href="signup.html">Sign up</a>
      &nbsp;&middot;&nbsp;
      <a href="admin-signup.html">Create Admin Account</a>
    </p>

  </div>
</div>

<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script>
  // Redirect immediately if already authenticated
  (function () {
    var user = Auth.getUser();
    if (user && Auth.getToken()) {
      window.location.replace(user.role === 'admin' ? 'admin.html' : 'dashboard.html');
    }
  }());

  var form   = document.getElementById('login-form');
  var errEl  = document.getElementById('error-msg');
  var btn    = document.getElementById('submit-btn');

  function showError(msg) {
    errEl.textContent = msg;
    errEl.style.display = 'block';
  }

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    errEl.style.display = 'none';

    var email    = document.getElementById('email').value.trim();
    var password = document.getElementById('password').value;

    if (!email || !password) {
      showError('Email and password are required.');
      return;
    }

    btn.disabled    = true;
    btn.textContent = 'Please wait\u2026';

    API.login(email, password)
      .then(function (data) {
        Auth.setAuth(data.token, data.user);
        window.location.replace(data.user.role === 'admin' ? 'admin.html' : 'dashboard.html');
      })
      .catch(function (err) {
        showError(err.message || 'Login failed. Please try again.');
        btn.disabled    = false;
        btn.textContent = 'Login';
      });
  });
</script>

</body>
</html>
